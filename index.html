<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LEGO Webshop</title>
        <link rel="icon" type="image/png" href="/public/favicon.png" />
        <link rel="stylesheet" href="/src/css/style.css" />
    </head>
    <body>
        <nav class="navbar bg-black w-full h-20 fixed flex flex-row justify-between">
            <div class="start w-45 h-full flex justify-center">
                <a href="index.html" class="flex flex-row items-center my-3">
                    <img src="src/assets/LEGO-logo.png" class="h-15" alt="LEGO logo"
                /></a>
            </div>
            <div class="end w-35.5 flex justify-center items-center">
                <a
                    href="shopping-cart.html"
                    class="text-white hover:bg-neutral-700 hover:rounded-full w-10 h-10 flex justify-center items-center"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="22"
                        height="22"
                        fill="currentColor"
                        class="bi bi-cart-fill"
                        viewBox="0 0 16 16"
                    >
                        <path
                            d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"
                        />
                    </svg>
                </a>
                <span id="badge" class="bg-red-600 w-3 h-3 absolute top-6 right-13.5 rounded-full"></span>
            </div>
        </nav>
        <h1 class="pt-25 text-3xl text-center">Productoverzicht</h1>
        <div
            class="producten-grid flex flex-col items-center justify-center md:items-stretch md:flex-row md:flex-wrap px-7 md:px-5 pt-5 mb-5"
        ></div>
        <script type="module" src="/src/js/main.js"></script>
    </body>
</html>
