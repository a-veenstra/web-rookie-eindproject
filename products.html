<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LEGO Webshop</title>
        <link rel="icon" type="image/png" href="/public/favicon.png" />
        <link rel="stylesheet" href="/src/css/orders-products.css" />
    </head>
    <body>
        <nav class="navbar bg-black w-full h-20 fixed flex flex-row justify-between">
            <div class="start w-[307px] h-full flex justify-center items-center">
                <a href="index.html" class="flex flex-row items-center my-3">
                    <img src="src/assets/LEGO-logo.png" class="h-15"
                /></a>
                <p class="text-white text-xl ml-4">Admin Panel</p>
            </div>
            <div class="end w-78 flex justify-center items-center text-white">
                <a href="orders.html" class="border rounded-md py-2 px-4 hover:bg-neutral-800">Orders</a>
                <a href="products.html" class="bg-[red] border border-[red] rounded-md py-2 px-4 ml-2">Products</a>
            </div>
        </nav>
        <h1 class="pt-25 text-3xl text-center">Productoverzicht</h1>
        <div class="container w-250 mt-5 mx-auto">
            <div class="flex justify-between">
                <button
                    id="reset-button"
                    class="text-[red] border rounded-md hover:bg-[red] hover:text-white hover:border-[red] cursor-pointer py-1 px-2"
                >
                    Reset producten
                </button>
                <a
                    href="./add-product.html"
                    class="text-[red] hover:bg-[red] hover:text-white hover:border-[red] border rounded-full w-8 flex justify-center items-center"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="30"
                        height="30"
                        fill="currentColor"
                        class="bi bi-plus"
                        viewBox="0 0 16 16"
                    >
                        <path
                            d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"
                        />
                    </svg>
                </a>
            </div>
            <table id="productenlijst" class="w-full mb-5">
                <tr>
                    <th>ID</th>
                    <th>Naam</th>
                    <th>Prijs</th>
                    <th>Afbeelding URL</th>
                </tr>
            </table>
        </div>
        <script type="module" src="/src/js/products.js"></script>
    </body>
</html>
